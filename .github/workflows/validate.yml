name: Validate data files
on:
  push:
    paths: ["data/**"]
  pull_request:
    paths: ["data/**"]
jobs:
  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          for f in data/*.json; do
            jq empty "$f" && echo "OK: $f"
          done
